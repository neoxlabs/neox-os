name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go (system)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: go/go.sum
      - name: Build
        working-directory: go
        run: go build ./...
      - name: Vet
        working-directory: go
        run: go vet ./...
      - name: Test
        working-directory: go
        run: go test ./...

  console:
    name: Console (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: |
          npm ci --no-audit --no-fund
          npm --prefix packages/apps/console ci --no-audit --no-fund
      - name: Type-check
        working-directory: packages/apps/console
        run: npm run typecheck
      - name: Test
        working-directory: packages/apps/console
        run: npx vitest run
